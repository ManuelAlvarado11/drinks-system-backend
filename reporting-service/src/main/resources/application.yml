spring:
  application:
    name: reporting-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:drinks_db}
    username: ${REPORTING_DB_USER:reporting_user}
    password: ${REPORTING_DB_PASSWORD:dev_password_reporting}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: reporting
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

server:
  port: 8084

security:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-for-local-development-only-minimum-32-chars!!}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

reporting:
  refresh:
    daily-sales-ms: ${REPORTING_REFRESH_DAILY_MS:300000}
    monthly-sales-ms: ${REPORTING_REFRESH_MONTHLY_MS:3600000}
    product-ranking-ms: ${REPORTING_REFRESH_RANKING_MS:3600000}
    inventory-status-ms: ${REPORTING_REFRESH_INVENTORY_MS:300000}
