spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${INVENTORY_DB_USER}
    password: ${INVENTORY_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE}
      minimum-idle: ${HIKARI_MIN_IDLE}

security:
  jwt:
    secret: ${JWT_SECRET}

server:
  error:
    include-stacktrace: never
    include-message: never

springdoc:
  swagger-ui:
    enabled: false

logging:
  level:
    drinks.system: INFO
