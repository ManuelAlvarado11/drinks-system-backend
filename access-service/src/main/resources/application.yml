spring:
  application:
    name: access-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:drinks_db}
    username: ${ACCESS_DB_USER:access_user}
    password: ${ACCESS_DB_PASSWORD:dev_password_access}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:drinks_db}
    user: ${DB_ADMIN_USER:drinks_admin}
    password: ${DB_ADMIN_PASSWORD:dev_password_admin}
    locations: classpath:db/migration
    schemas: access,sales,inventory,reporting
    default-schema: access
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: access
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    defer-datasource-initialization: false

server:
  port: 8081

security:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-for-local-development-only-minimum-32-chars!!}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}
    refresh-token-expiration-days: ${REFRESH_TOKEN_EXPIRATION_DAYS:7}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    org.flywaydb: DEBUG
